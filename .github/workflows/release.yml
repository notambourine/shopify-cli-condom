name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # gh release create
      id-token: write # npm trusted publishing. The registry authorizes this file by name.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # A cache hit would publish a tree the lockfile did not resolve.

      # Keep this after setup-node and before npm ci so its npm shim wins.
      - uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free

      # Install scripts hard-link esbuild's platform binary into the bundle, which npm pack
      # then emits as a hardlink entry that consumers cannot extract.
      - run: sfw npm ci --ignore-scripts

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - name: verify tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::$TAG does not match package.json $VERSION"; exit 1
          fi

      - run: npm publish

      - name: create github release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --verify-tag --generate-notes
