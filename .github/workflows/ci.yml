name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  fleet:
    permissions:
      contents: read
    uses: notambourine/fleet-actions/.github/workflows/fleet-ci.yml@395ca93d41a57ade33fa1ad846befac455f063ac # v1.10.2
    with:
      vet: true # One manifest with one dependency; the scan costs seconds.
      runs-on: blacksmith-2vcpu-ubuntu-2404

  build:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # Keep this after setup-node and before npm ci so its npm shim wins.
      - uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free

      # Install scripts hard-link esbuild's platform binary into the bundle, which npm pack
      # then emits as a hardlink entry that consumers cannot extract.
      - run: sfw npm ci --ignore-scripts

      - uses: notambourine/wormhook@f50af233c374a4646a310b2f53f3ecff3972d163 # v0.35.1
        with:
          mode: deep

      # No guarddog: its heuristics fire on @shopify/cli's own minified bundle,
      # which this repo exists to vendor. Socket, vet, and wormhook cover the tree.

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

  worker:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: read
    timeout-minutes: 10
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free

      - run: sfw npm ci --ignore-scripts

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test
