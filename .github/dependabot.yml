version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 2
      semver-major-days: 5
    groups:
      security:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /worker
    schedule:
      interval: weekly
    cooldown:
      default-days: 2
      semver-major-days: 5
    groups:
      security:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 2
    groups:
      security:
        applies-to: security-updates
        patterns:
          - "*"
