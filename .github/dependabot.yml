version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /worker
    schedule:
      interval: weekly
    cooldown:
      default-days: 2
      semver-major-days: 5
    groups:
      security:
        applies-to: security-updates
        patterns:
          - "*"
      # The bundled CLI defines the proxy's allowed operations, so it gets its own review.
      shopify-cli:
        patterns:
          - "@shopify/cli"
      npm:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 2
    groups:
      security:
        applies-to: security-updates
        patterns:
          - "*"
      actions:
        patterns:
          - "*"
